[project]
name = "veraplex-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["anthropic", "httpx", "fastapi", "sqlalchemy>=2", "alembic", "pydantic-settings", "pyjwt", "uvicorn"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "import-linter", "cryptography", "psycopg[binary]"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Module layering: higher modules may import lower ones, never the reverse"
type = "layers"
layers = ["app.modules.ai", "app.modules.admin", "app.modules.quality", "app.modules.documents", "app.modules.records", "app.modules.audit", "app.modules.identity"]
containers = []
