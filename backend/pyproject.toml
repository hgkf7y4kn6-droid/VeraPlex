[project]
name = "veraplex-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "import-linter>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Module layering: signatures > records > audit > identity"
type = "layers"
layers = [
  "app.modules.signatures",
  "app.modules.records",
  "app.modules.audit",
  "app.modules.identity",
]

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["B008", "E501"]  # B008: FastAPI Depends() idiom
